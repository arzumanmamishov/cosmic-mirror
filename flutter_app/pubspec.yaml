name: cosmic_mirror
description: A premium astrology and self-guidance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  # purchases_flutter (RevenueCat) is kept for backward compatibility
  # while Stripe is rolled out. Both can coexist; the paywall now uses
  # flutter_stripe by default.
  cached_network_image: ^3.3.1
  dio: ^5.4.3+1
  equatable: ^2.0.5
  firebase_auth: ^4.19.5
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_stripe: ^11.1.0
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  intl: any
  json_annotation: ^4.9.0
  lottie: ^3.1.0
  path_provider: ^2.1.0
  purchases_flutter: ^8.4.0
  riverpod_annotation: ^2.3.5
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^6.1.0
  url_launcher: ^6.2.6
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0
  very_good_analysis: ^5.1.0

# Pin google_sign_in_ios to a 5.7.x release so it keeps using
# GoogleSignIn 7.x / GoogleUtilities 7.x — newer 5.8+ pulls
# GoogleSignIn 8 which clashes with Firebase iOS 10's GoogleUtilities 7.
dependency_overrides:
  google_sign_in_ios: ">=5.7.0 <5.8.0"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Lively design-system fonts — bundled (not runtime-fetched) per the
  # design handoff. Geist + Geist Mono are variable fonts; Flutter maps
  # FontWeight onto their wght axis.
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
