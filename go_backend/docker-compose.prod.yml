# Production stack: Caddy (automatic HTTPS) → api → postgres / redis.
#
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy publishes ports. Postgres, Redis and the API are reachable
# solely on the private "backend" network.
#
# POSTGRES_PASSWORD / REDIS_PASSWORD are pasted into the DATABASE_URL /
# REDIS_URL below without escaping, so generate them with
# `openssl rand -hex 32` (URL-safe). The API refuses to boot with a clear
# error if either URL doesn't parse.
#
# Images are pinned so a rebuild never silently changes a major/minor
# version. Bump the tags deliberately (and read the release notes).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  api:
    build: .
    image: cosmic-mirror-api:latest
    restart: unless-stopped
    # The server drains in-flight requests and workers for up to ~60s on
    # SIGTERM; give it that long before Docker sends SIGKILL.
    stop_grace_period: 100s  # > shutdownGrace (90s) in cmd/server/main.go
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgres://cosmic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cosmic_mirror?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      # Caddy is the only proxy; trust X-Forwarded-For from this network only.
      TRUSTED_PROXIES: 10.88.0.0/24
      EPHEMERIS_PATH: /app/ephemeris
      SE_EPHE_PATH: /app/ephemeris
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  postgres:
    image: postgres:15.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cosmic_mirror
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic -d cosmic_mirror"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      # Every key the API writes has a TTL (caches: 1-30 days; rate-limit,
      # login-lockout and AI-usage counters: 60s-48h), so volatile-lru
      # would evict exactly the same set as allkeys-lru. LRU keeps the hot,
      # short-lived security counters and evicts stale chart caches first.
      # OTP brute-force limits live in Postgres, not here.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *logging

networks:
  backend:
    ipam:
      config:
        - subnet: 10.88.0.0/24

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
